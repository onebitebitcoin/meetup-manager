name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    env:
      TARGET_DIR: /home/measly/prod/onebitebitcoin/meetup
      COMPOSE: /usr/libexec/docker/cli-plugins/docker-compose

    steps:
      - name: Pull latest changes
        run: git -C "$TARGET_DIR" pull --ff-only origin main

      - name: Build image
        run: docker build -t meetup-web "$TARGET_DIR"

      - name: Restart web
        run: |
          $COMPOSE -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps --no-build web
          $COMPOSE -f "$TARGET_DIR/docker-compose.yml" exec -T web python manage.py migrate --noinput

      - name: Health check
        run: |
          sleep 5
          curl -fsS http://localhost:8000/api/health/ || ($COMPOSE -f "$TARGET_DIR/docker-compose.yml" logs web && exit 1)
