services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetup}
      POSTGRES_USER: ${POSTGRES_USER:-meetup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetup}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: meetup_backend.settings_production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-meetup}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-meetup}
      DATABASE_SSL_REQUIRE: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-meet.onebitebitcoin.com,localhost}
      SITE_URL: ${SITE_URL:-https://meet.onebitebitcoin.com}
      MEDIA_ROOT: /data/media
    volumes:
      - /var/www/meet/media:/data/media
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn meetup_backend.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --log-level info"]
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
