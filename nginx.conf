# 이미지 외 첨부는 내려받기로 처리한다(빈 값이면 add_header가 생략된다)
map $uri $chat_disposition {
    default attachment;
    ~*\.(jpe?g|png|gif|webp)$ "";
}

server {
    listen 80;
    server_name meet.onebitebitcoin.com;

    # Let's Encrypt 인증용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP → HTTPS 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meet.onebitebitcoin.com;

    ssl_certificate /etc/letsencrypt/live/meet.onebitebitcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.onebitebitcoin.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50M;

    # 미디어 파일 직접 서빙
    location /media/ {
        alias /data/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 채팅 첨부: 브라우저가 내용을 추측해 실행하지 못하게 하고, 이미지 외에는 내려받기로 처리
    location /media/lite/chat/ {
        alias /data/media/lite/chat/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition $chat_disposition;
    }

    # 나머지는 Django로 프록시
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
