[pytest]
DJANGO_SETTINGS_MODULE = meetup_backend.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    closed: 오픈 전 잠금 상태를 그대로 두고 시험한다
