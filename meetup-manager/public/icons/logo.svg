<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <circle cx="60" cy="60" r="60" fill="url(#gradient)"/>
  
  <!-- Main circle representing people gathering -->
  <circle cx="60" cy="60" r="35" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- People dots arranged in a circle -->
  <circle cx="60" cy="30" r="3" fill="white"/>
  <circle cx="45" cy="38" r="3" fill="white"/>
  <circle cx="35" cy="55" r="3" fill="white"/>
  <circle cx="45" cy="82" r="3" fill="white"/>
  <circle cx="60" cy="90" r="3" fill="white"/>
  <circle cx="75" cy="82" r="3" fill="white"/>
  <circle cx="85" cy="55" r="3" fill="white"/>
  <circle cx="75" cy="38" r="3" fill="white"/>
  
  <!-- Central bite mark -->
  <path d="M60 60 Q50 55 45 60 Q50 65 60 60" fill="white"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5b413;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>