<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded rectangle for masking -->
  <rect x="80" y="120" width="352" height="320" rx="24" ry="24" fill="#000000"/>
  
  <!-- Calendar binding rings -->
  <rect x="160" y="80" width="12" height="80" rx="6" ry="6" fill="#000000"/>
  <rect x="200" y="80" width="12" height="80" rx="6" ry="6" fill="#000000"/>
  <rect x="300" y="80" width="12" height="80" rx="6" ry="6" fill="#000000"/>
  <rect x="340" y="80" width="12" height="80" rx="6" ry="6" fill="#000000"/>
  
  <!-- Calendar grid lines -->
  <line x1="80" y1="240" x2="432" y2="240" stroke="#ffffff" stroke-width="2"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#ffffff" stroke-width="2"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#ffffff" stroke-width="2"/>
  <line x1="80" y1="360" x2="432" y2="360" stroke="#ffffff" stroke-width="2"/>
  
  <line x1="130" y1="200" x2="130" y2="440" stroke="#ffffff" stroke-width="2"/>
  <line x1="180" y1="200" x2="180" y2="440" stroke="#ffffff" stroke-width="2"/>
  <line x1="230" y1="200" x2="230" y2="440" stroke="#ffffff" stroke-width="2"/>
  <line x1="280" y1="200" x2="280" y2="440" stroke="#ffffff" stroke-width="2"/>
  <line x1="330" y1="200" x2="330" y2="440" stroke="#ffffff" stroke-width="2"/>
  <line x1="380" y1="200" x2="380" y2="440" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Today highlight -->
  <rect x="181" y="241" width="48" height="38" fill="#ffffff" rx="4" ry="4"/>
</svg>