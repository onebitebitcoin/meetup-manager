<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="calendarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="80" y="120" width="352" height="320" rx="24" ry="24" fill="url(#calendarGrad)" stroke="#1e3a8a" stroke-width="4"/>
  
  <!-- Calendar header -->
  <rect x="80" y="120" width="352" height="80" rx="24" ry="24" fill="#1e40af"/>
  <rect x="80" y="170" width="352" height="30" fill="#1e40af"/>
  
  <!-- Calendar binding rings -->
  <rect x="160" y="80" width="12" height="80" rx="6" ry="6" fill="#6b7280"/>
  <rect x="200" y="80" width="12" height="80" rx="6" ry="6" fill="#6b7280"/>
  <rect x="300" y="80" width="12" height="80" rx="6" ry="6" fill="#6b7280"/>
  <rect x="340" y="80" width="12" height="80" rx="6" ry="6" fill="#6b7280"/>
  
  <!-- Calendar grid lines -->
  <!-- Horizontal lines -->
  <line x1="80" y1="240" x2="432" y2="240" stroke="#2563eb" stroke-width="2"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#2563eb" stroke-width="2"/>
  <line x1="80" y1="360" x2="432" y2="360" stroke="#2563eb" stroke-width="2"/>
  <line x1="80" y1="400" x2="432" y2="400" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Vertical lines -->
  <line x1="130" y1="200" x2="130" y2="440" stroke="#2563eb" stroke-width="2"/>
  <line x1="180" y1="200" x2="180" y2="440" stroke="#2563eb" stroke-width="2"/>
  <line x1="230" y1="200" x2="230" y2="440" stroke="#2563eb" stroke-width="2"/>
  <line x1="280" y1="200" x2="280" y2="440" stroke="#2563eb" stroke-width="2"/>
  <line x1="330" y1="200" x2="330" y2="440" stroke="#2563eb" stroke-width="2"/>
  <line x1="380" y1="200" x2="380" y2="440" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Today highlight -->
  <rect x="181" y="241" width="48" height="38" fill="#f59e0b" rx="4" ry="4"/>
  
  <!-- Date number -->
  <text x="205" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">15</text>
  
  <!-- Event dots -->
  <circle cx="155" cy="300" r="4" fill="#ef4444"/>
  <circle cx="105" cy="340" r="4" fill="#10b981"/>
  <circle cx="355" cy="380" r="4" fill="#8b5cf6"/>
</svg>